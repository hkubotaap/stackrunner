<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STACK RUNNER - 脱出ゲーム</title>
<style>
  :root {
    --panel: rgba(14, 18, 24, 0.78);
    --line: rgba(255, 255, 255, 0.14);
    --text: #eef2f6;
    --dim: #9aa6b2;
    --accent: #ffb020;
    --good: #4cd08a;
    --warn: #ffb020;
    --bad: #ff5d5d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9ec5e8; color: var(--text);
    font-family: "Yu Gothic UI", "Meiryo UI", "Hiragino Sans", system-ui, sans-serif; font-size: 13px; }
  canvas { display: block; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; backdrop-filter: blur(6px); user-select: none; }
  .panel h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .12em; color: var(--dim); font-weight: 600; }

  #car { top: 12px; left: 12px; width: 300px; }
  #speedrow { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  #speed { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.2ch; text-align: right; }
  #speedrow small { color: var(--dim); }
  #vsa { margin-left: auto; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); cursor: pointer;
    background: transparent; color: var(--text); font: inherit; }
  #vsa.on { border-color: var(--warn); color: var(--warn); }
  #vsa.cut { background: var(--warn); color: #111; }
  .wheel { display: grid; grid-template-columns: 38px 1fr 54px; gap: 2px 8px; align-items: center; padding: 5px 6px;
    border-radius: 6px; border: 1px solid transparent; cursor: pointer; }
  .wheel:hover { background: rgba(255,255,255,.05); }
  .wheel.sel { border-color: var(--accent); background: rgba(255,176,32,.1); }
  .wheel .nm { font-weight: 700; }
  .wheel .sf { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wheel .st { text-align: right; font-size: 12px; }
  .wheel .bar { grid-column: 1 / 4; height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
  .wheel .bar i { display: block; height: 100%; width: 0; background: var(--good); }
  .st.spin { color: var(--bad); font-weight: 700; }
  .st.air { color: var(--warn); }
  #lamps { display: flex; gap: 6px; margin: 2px 0 8px; flex-wrap: wrap; }
  #lamps span { padding: 2px 8px; border-radius: 5px; border: 1px solid var(--line); color: #5c6670; font-size: 11px; font-weight: 700; letter-spacing: .04em; }
  #lamps span.on { color: #fff; background: var(--bad); border-color: var(--bad); }
  #lamps span.hold { color: #111; background: var(--good); border-color: var(--good); }
  #misc { margin-top: 8px; color: var(--dim); font-size: 12px; line-height: 1.6; }

  #log { top: 12px; right: 12px; width: 330px; max-height: 40vh; overflow: hidden; display: flex; flex-direction: column; gap: 4px; }
  #log:empty { display: none; }
  #log div { padding: 5px 8px; border-left: 3px solid var(--dim); background: rgba(255,255,255,.04); border-radius: 0 6px 6px 0;
    transition: opacity .6s; font-size: 12.5px; line-height: 1.45; }
  #log .good { border-color: var(--good); } #log .warn { border-color: var(--warn); } #log .bad { border-color: var(--bad); }

  #tools { bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: stretch; max-width: 96vw; flex-wrap: wrap; justify-content: center; }
  .grp { display: flex; flex-direction: column; gap: 5px; }
  .row { display: flex; gap: 5px; flex-wrap: wrap; }
  button.tb { font: inherit; color: var(--text); background: rgba(255,255,255,.07); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
  button.tb:hover { background: rgba(255,255,255,.14); }
  button.tb:disabled { opacity: .35; cursor: default; }
  button.tb.on { border-color: var(--accent); background: rgba(255,176,32,.18); }
  button.tb kbd { margin-left: 6px; padding: 0 4px; border-radius: 3px; background: rgba(0,0,0,.35); color: var(--dim); font-size: 11px; }
  #jackinfo, #ropeinfo, #brakeinfo { color: var(--dim); font-size: 12px; min-height: 1.4em; }

  #armhint { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 99px;
    background: rgba(255,176,32,.92); color: #111; font-weight: 700; display: none; pointer-events: none; z-index: 6; max-width: 92vw; text-align: center; }
  canvas.armed { cursor: crosshair; }
  #touch { display: none; position: fixed; left: 0; right: 0; bottom: calc(var(--tools-h, 150px) + 18px); pointer-events: none;
    justify-content: space-between; padding: 0 14px; z-index: 5; }
  #touch .pad { display: flex; gap: 10px; pointer-events: auto; }
  #touch button { width: 64px; height: 64px; border-radius: 16px; border: 1px solid var(--line); background: rgba(14,18,24,.72);
    color: var(--text); font: inherit; font-size: 22px; touch-action: none; user-select: none; }
  #touch button.down { background: rgba(255,176,32,.55); color: #111; }
  @media (pointer: coarse) {
    #touch { display: flex; }
    #help { display: none; }
    #tools { max-height: 38vh; overflow: auto; }
  }
  #help { bottom: 12px; left: 12px; color: var(--dim); line-height: 1.7; font-size: 12px; max-width: 250px; }
  #help b { color: var(--text); font-weight: 600; }

  #end { inset: 0; margin: auto; width: 360px; height: fit-content; text-align: center; padding: 22px; display: none; }
  #end h1 { margin: 0 0 8px; font-size: 26px; }
  #end.win h1 { color: var(--good); } #end.lose h1 { color: var(--bad); }
  #end p { margin: 4px 0; color: var(--dim); }
  #end button { margin-top: 14px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #223; font-size: 15px; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/",
    "cannon-es": "./vendor/cannon-es/cannon-es.js"
} }
</script>
</head>
<body>
<div id="loading">読み込み中…</div>

<div id="armhint"></div>
<div id="touch">
  <div class="pad"><button data-key="KeyA" aria-label="左">◀</button><button data-key="KeyD" aria-label="右">▶</button></div>
  <div class="pad"><button data-key="ShiftLeft" aria-label="ブレーキ" style="font-size:13px">BRAKE</button><button data-key="KeyS" aria-label="後退">▼</button><button data-key="KeyW" aria-label="前進">▲</button></div>
</div>

<div id="car" class="panel">
  <h2 id="cartitle">N-BOX CUSTOM 4WD</h2>
  <div id="speedrow"><span id="speed">0</span><small>km/h</small><span id="gear"></span>
    <button id="vsa" title="V">VSA</button></div>
  <div id="lamps"><span id="l-side" title="サイドブレーキ">(P) SIDE</span><span id="l-foot" title="フットブレーキ">BRAKE</span><span id="l-hold" title="オートブレーキホールド">AUTO HOLD</span></div>
  <div id="wheels"></div>
  <div id="misc"></div>
</div>

<div id="log" class="panel"></div>

<div id="tools" class="panel">
  <div class="grp">
    <h2>道具: ボタンで選んで地面をクリック/タップ</h2>
    <div class="row">
      <button class="tb" id="b-helper">スノーヘルパー<kbd>Q</kbd></button>
      <button class="tb" id="b-mat">フロアマット<kbd>E</kbd></button>
      <button class="tb" id="b-scoop">スコップ<kbd>C</kbd></button>
      <button class="tb" id="b-recover">回収<kbd>⌫</kbd></button>
    </div>
    <h2 style="margin-top:4px">キー Q/E は向き指定で即配置 <span style="letter-spacing:0">[F で切替]</span></h2>
    <div class="row" id="dirs"></div>
  </div>
  <div class="grp">
    <h2>ジャッキ</h2>
    <div class="row">
      <button class="tb" id="b-jack">設置/撤去<kbd>J</kbd></button>
      <button class="tb" id="b-up">上げ<kbd>Z</kbd></button>
      <button class="tb" id="b-down">下げ<kbd>X</kbd></button>
    </div>
    <div id="jackinfo"></div>
  </div>
  <div class="grp">
    <h2>ロープ + 軽トラ</h2>
    <div class="row">
      <button class="tb" id="b-rope">接続/解除<kbd>R</kbd></button>
      <button class="tb" id="b-pull">引いてもらう(長押し)<kbd>G</kbd></button>
    </div>
    <div id="ropeinfo"></div>
  </div>
  <div class="grp">
    <h2>ブレーキ</h2>
    <div class="row">
      <button class="tb" id="b-foot">フット(長押し)<kbd>Shift</kbd></button>
      <button class="tb" id="b-side">サイド<kbd>Space</kbd></button>
    </div>
    <div id="brakeinfo"></div>
  </div>
  <div class="grp">
    <h2>ステージ / 車種 / 難易度</h2>
    <div class="row" id="stages"></div>
    <div class="row" id="cars"></div>
    <div class="row" id="levels"></div>
    <div class="row"><button class="tb" id="b-reset">リセット<kbd>Esc</kbd></button></div>
  </div>
</div>

<div id="help" class="panel">
  <b>W/S</b> 前進・後退 &nbsp; <b>A/D</b> ハンドル<br>
  <b>Shift</b> フットブレーキ &nbsp; <b>Space</b> サイドブレーキ(後輪ロック)<br>
  <b>クリック/タップ</b> 道具を置く・雪を掘る(スコップ)・タイヤ選択<br>
  <b>1-4</b> タイヤ選択 &nbsp; <b>V</b> VSA切替 &nbsp; <b>M</b> ミュート<br>
  ドラッグで視点回転 / ホイールでズーム
</div>

<div id="end" class="panel">
  <h1></h1>
  <div id="endbody"></div>
  <button class="tb" id="b-retry">もう一度</button>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
